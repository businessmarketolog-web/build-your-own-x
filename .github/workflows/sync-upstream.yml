name: Sync Build Your Own X upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-master
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'businessmarketolog-web/build-your-own-x'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge upstream without force-push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=master
